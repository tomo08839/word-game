    <title>早押しワードゲーム｜頭文字と文字数で対戦する早押しクイズ</title>
    <meta
      name="description"
      content="早押しワードゲームは、指定された頭文字と文字数に合う日本語の言葉を制限時間30秒以内にできるだけ早く入力して得点を競う無料の早押しクイズゲームです。ひとりで練習できるモードと、友達とオンラインで対戦できるモードがあり、通常モードのほかに6〜9文字の難しい言葉が中心のハードモードも選べます。"
